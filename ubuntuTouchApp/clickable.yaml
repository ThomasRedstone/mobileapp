clickable_minimum_required: 8.9.0

# Package an already verified target-native app image. build-public.sh supports
# native ARM64 builds; build-hybrid.sh compiles JVM code natively on the host
# and runs only target JDK jpackage in the isolated ARM64 packager.
builder: custom
framework: ubuntu-touch-24.04-1.x

build:
  - chmod +x $ROOT/coreapp/bin/coreapp $ROOT/coreapp/lib/libapplauncher.so $ROOT/coreapp-launch.sh

install_root_data:
  - manifest.json
  - coreapp.apparmor
  - coreapp.desktop
  - coreapp-launch.sh
  - coreapp
