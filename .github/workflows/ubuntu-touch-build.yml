name: Ubuntu Touch distributable (ARM64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Android SDK
        # android-actions/setup-android installs the legacy "tools" meta-package by default,
        # which pulls in the emulator - unavailable for linux-aarch64, so it fails outright.
        # No emulator is needed for a build, only enough SDK to let Gradle configure the
        # project graph (which includes Android modules even when only building the desktop
        # distributable) - install just those packages directly instead.
        run: |
          SDK_ROOT="$HOME/android-sdk"
          CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -sSL "$CMDLINE_TOOLS_URL" -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          # Licenses accepted here cover AGP's own SDK auto-download too (same sdk_root). Install
          # platform-tools only - compileSdk 37 isn't in sdkmanager's stable channel yet (this
          # project targets a preview API level), so let AGP fetch platforms/build-tools itself
          # on demand once licenses are pre-accepted against this sdk_root.
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" \
            "platform-tools" >/dev/null
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_ROOT" > local.properties
      - name: Cache build deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ut-arm64-deps-${{ runner.os }}-${{ hashFiles('gradle/**', 'gradlew*', 'gradle.properties', '*.gradle*') }}
          restore-keys: |
            ut-arm64-deps-${{ runner.os }}-
      - name: Use dummy google-services json
        run: mv androidApp/src/google-services-dummy.json androidApp/src/google-services.json
      - name: Build distributable (native ARM64 - no qemu cross-compile)
        run: ./gradlew :composeApp:createDistributable --no-configuration-cache
        env:
          GITHUB_ACTOR: ${{ secrets.READ_PACKAGES_ACTOR }}
          GITHUB_TOKEN: ${{ secrets.READ_PACKAGES_TOKEN }}
      - name: Verify architecture
        run: file composeApp/build/compose/binaries/main/app/coreapp/bin/coreapp
      - name: Upload distributable
        uses: actions/upload-artifact@v4
        with:
          name: coreapp-distributable
          path: composeApp/build/compose/binaries/main/app/coreapp/
          retention-days: 7
